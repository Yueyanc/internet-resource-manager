name: Deploy Alpha

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag on main to deploy (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-alpha
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Alpha
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: ghcr.io/yueyanc/internet-resource-manager
    steps:
      - name: Resolve release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag '${TAG}'. Expected vMAJOR.MINOR.PATCH."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}
          fetch-depth: 0

      - name: Verify tag is on main branch
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          TAG_COMMIT="$(git rev-parse 'HEAD^{commit}')"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main; then
            echo "::error::Tag ${RELEASE_TAG} (${TAG_COMMIT}) does not belong to main. Aborting deployment."
            exit 1
          fi
          echo "Verified ${RELEASE_TAG} (${TAG_COMMIT}) is on main."

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run quality gate
        run: |
          pnpm install --frozen-lockfile
          go mod download
          pnpm check
          pnpm db:generate
          git diff --exit-code -- internal/storage/queries

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push container image
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            -f deploy/Dockerfile \
            --build-arg "VERSION=${RELEASE_TAG}" \
            -t "${IMAGE_REPO}:${RELEASE_TAG}" \
            -t "${IMAGE_REPO}:latest" \
            .
          docker push "${IMAGE_REPO}:${RELEASE_TAG}"
          docker push "${IMAGE_REPO}:latest"

      - name: Deploy to Alpha server
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          ALPHA_SSH_HOST: ${{ secrets.ALPHA_SSH_HOST }}
          ALPHA_SSH_PORT: ${{ secrets.ALPHA_SSH_PORT }}
          ALPHA_SSH_USER: ${{ secrets.ALPHA_SSH_USER }}
          ALPHA_SSH_PRIVATE_KEY: ${{ secrets.ALPHA_SSH_PRIVATE_KEY }}
          ALPHA_SSH_KNOWN_HOSTS: ${{ secrets.ALPHA_SSH_KNOWN_HOSTS }}
          IRM_PUBLIC_URL: ${{ secrets.IRM_PUBLIC_URL }}
          IRM_ADMIN_USER: ${{ secrets.IRM_ADMIN_USER }}
          IRM_ADMIN_PASSWORD: ${{ secrets.IRM_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$ALPHA_SSH_PRIVATE_KEY" > ~/.ssh/alpha_deploy_key
          chmod 600 ~/.ssh/alpha_deploy_key
          printf '%s\n' "$ALPHA_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          SSH_PORT="${ALPHA_SSH_PORT:-22}"
          SSH_OPTS=(-i ~/.ssh/alpha_deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts)
          SCP_OPTS=(-i ~/.ssh/alpha_deploy_key -P "$SSH_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts)
          REMOTE="${ALPHA_SSH_USER}@${ALPHA_SSH_HOST}"
          REMOTE_DIR="/opt/internet-resource-manager"

          node <<'NODE'
          const fs = require("node:fs");
          const sq = (v) => `'${String(v ?? "")}'`;
          const lines = [
            `IRM_IMAGE=${sq(`${process.env.IMAGE_REPO}:${process.env.RELEASE_TAG}`)}`,
            `IRM_ALLOWED_ORIGINS=${sq(process.env.IRM_PUBLIC_URL)}`,
            `IRM_ADMIN_USER=${sq(process.env.IRM_ADMIN_USER)}`,
            `IRM_ADMIN_PASSWORD=${sq(process.env.IRM_ADMIN_PASSWORD)}`,
          ];
          fs.writeFileSync(".alpha.env", lines.join("\n") + "\n", { mode: 0o600 });
          NODE

          ssh "${SSH_OPTS[@]}" "$REMOTE" "mkdir -p ${REMOTE_DIR} && chmod 700 ${REMOTE_DIR}"
          scp "${SCP_OPTS[@]}" deploy/compose.alpha.yaml "${REMOTE}:${REMOTE_DIR}/docker-compose.yml"
          scp "${SCP_OPTS[@]}" .alpha.env "${REMOTE}:${REMOTE_DIR}/.env.tmp"
          rm -f .alpha.env

          docker save "${IMAGE_REPO}:${RELEASE_TAG}" | gzip -1 | ssh "${SSH_OPTS[@]}" "$REMOTE" "gunzip | docker load"

          ssh "${SSH_OPTS[@]}" "$REMOTE" "
            set -euo pipefail
            cd ${REMOTE_DIR}
            chmod 600 .env.tmp
            mv .env.tmp .env
            docker compose up -d --remove-orphans
            for i in \$(seq 1 30); do
              if curl -fsS http://127.0.0.1:3660/api/v1/health | grep -q '\"status\":\"ok\"'; then
                break
              fi
              if [ \"\$i\" -eq 30 ]; then
                docker compose logs --tail=80
                exit 1
              fi
              sleep 1
            done
            docker image prune -f >/dev/null 2>&1 || true
          "

          curl -fsSL "${IRM_PUBLIC_URL}/api/v1/health" | grep -q "\"version\":\"${RELEASE_TAG}\""
          echo "Successfully deployed ${RELEASE_TAG} to ${IRM_PUBLIC_URL}"
